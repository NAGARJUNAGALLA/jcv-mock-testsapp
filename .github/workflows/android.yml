name: Build Native Android App (Debug)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 1: Generate wrapper on the server
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.2

      # Step 2: Build using the wrapper targeting the app module directly
      - name: Build Debug APK and AAB
        run: ./gradlew :app:assembleDebug :app:bundleDebug

      # Step 3: Upload Artifacts
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-aab
          path: app/build/outputs/bundle/debug/app-debug.aab
